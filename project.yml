name: VoiceHole
options:
  bundleIdPrefix: com.altbizney
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  VoiceHole:
    type: application
    platform: macOS
    sources:
      - Sources/VoiceHole
      - Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
    scheme: {}
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: VoiceHole
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altbizney.voicehole
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

  VoiceHole-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/VoiceHole
      - Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
    scheme: {}
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: VoiceHole
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altbizney.voicehole.ios
        PRODUCT_NAME: VoiceHole
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
