name: VoiceHole
options:
  bundleIdPrefix: com.altbizney
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  VoiceHole:
    type: application
    platform: macOS
    sources:
      - Sources/VoiceHole
      - Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
    scheme: {}
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: VoiceHole
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: VoiceHole records voice memos with your microphone. Audio stays on this device.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altbizney.voicehole
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: HFYS9XNM5B
        ENABLE_HARDENED_RUNTIME: NO

  VoiceHole-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/VoiceHole
      - Resources/Assets.xcassets
    dependencies:
      - package: WhisperKit
      - target: VoiceHoleShare
    entitlements:
      path: Support/VoiceHole-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.altbizney.voicehole
    scheme: {}
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: VoiceHole
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: VoiceHole records voice memos with your microphone. Audio stays on this device.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altbizney.voicehole.ios
        PRODUCT_NAME: VoiceHole
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HFYS9XNM5B
        TARGETED_DEVICE_FAMILY: "1,2"

  VoiceHoleShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/ShareExtension
    entitlements:
      path: Support/VoiceHoleShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.altbizney.voicehole
    info:
      path: Support/Info-Share.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: VoiceHole
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altbizney.voicehole.ios.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HFYS9XNM5B
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
